name: Regressão CNC
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/editor-lateral-perimetro-v2.18.0', 'revisoes/v2.21.0-dxf-assistente-3-etapas', 'revisoes/v2.22.0-desenho-quatro-caminhos', 'revisoes/v2.22.1-teste-dxf-real', 'revisoes/v2.22.2-revisao-completa', 'revisoes/v2.22.3-excluir-linha-layout', 'revisoes/v2.23.0-android', 'revisoes/v2.23.1-ferramentas-visual']
jobs:
  regressao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de geometria e gerador
        working-directory: Gerador
        run: |
          node testdxfwizard.js
          node testdxfreview.js
          node testroscasferr.js
          node testdialogos.js
          node test.js
          node testdxf.js
          node testdxfgeomedit.js
          node testdxfassist.js
          node testdxfedit.js
          node testdxfchains.js
          node testdxfaudit.js
          node testpdf.js
          node testpdfscale.js
          node testprog.js
      - name: Instalar Chromium para teste da interface DXF
        run: |
          npm install --prefix Gerador --no-save playwright@1.56.1
          npx --prefix Gerador playwright install --with-deps chromium
      - name: Testar as 3 etapas no navegador
        working-directory: Gerador
        run: |
          node testdxfwizardui.mjs
          node testdesenhoroutesui.mjs
          node testdxfui.mjs
          node testeditorcontrolsui.mjs
          node testandroidui.mjs
          node testferramentaslayoutui.mjs
