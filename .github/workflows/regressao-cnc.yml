name: Regressão CNC
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/editor-lateral-perimetro-v2.18.0', 'revisoes/v2.21.0-dxf-assistente-3-etapas']
jobs:
  regressao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de geometria e gerador
        working-directory: Gerador
        run: |
          node testdxfwizard.js
          node testroscasferr.js
          node testdialogos.js
          node test.js
          node testdxf.js
          node testdxfgeomedit.js
          node testdxfassist.js
          node testdxfedit.js
          node testdxfchains.js
          node testdxfaudit.js
          node testpdf.js
          node testpdfscale.js
          node testprog.js
